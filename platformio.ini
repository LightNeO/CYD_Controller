; CYD multi-device remote control
; Board: Sunton ESP32-2432S022C (2.4in 240x320 touch display)

[env:esp32-2432S022C]
platform = espressif32
board = esp32-2432S022C
board_dir = boards
framework = arduino
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_port = COM5
monitor_port = COM5

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git#2.1.1
    lvgl/lvgl@9.2.2
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    bblanchon/ArduinoJson@^7.4.2

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Ofast
    -Iinclude
    '-D BOARD_NAME="${this.board}"'
    '-D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO'
    '-D LV_CONF_INCLUDE_SIMPLE'
    '-D ARDUINO_LOOP_STACK_SIZE=24576'
